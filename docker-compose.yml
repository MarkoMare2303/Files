name: swissov-live

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: swissov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swissov
      POSTGRES_PASSWORD: swissov
      POSTGRES_DB: swissov_dev
      # Die zweite DB für Integrationstests wird vom Init-Script erzeugt.
      POSTGRES_EXTRA_DATABASES: swissov_test
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swissov -d swissov_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: swissov-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
